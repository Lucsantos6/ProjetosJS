<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste JS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
    width: 90%;
    max-width: 460px;
    border: 12px solid black;
    margin: auto;
    text-align: center;
    background-color: darkred;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font: 40pt normal;
}

@media(max-width: 600px) {
    body {

        font-size: 16px;
    }

    h1 {
        font-size: 1.5rem;
    }

    input,
    select {
        width: 100%
    }

}

h1 {
    margin-top: 0px;
    background-color: rgb(187, 199, 211);
    color: black;
    font: 30pt normal;
}

input {
    outline: auto;
    font: normal 20pt Arial;
    width: 100%;
    max-width: 300px;

}

select {
    outline: auto;
    font: 20pt Arial bold;
    width: 100%;
    height: 40px;
    max-width: 300px;
}

p {
    font: 20pt Arial normal;
}

main {
    padding-bottom: 0;
    margin-bottom: 0;
    background-color: rgb(167, 219, 252);
}
    </style>

</head>

<body>
    <main>
        <h1>Modelo de calculadora básica</h1>
        <p style="margin-bottom: 0px;">Coloque 2 números abaixo</p>
        <input type="number" name="cx1" id="cx1" placeholder="Número 1">
        <p style="margin-top: 10px; margin-bottom: 10pt;">e</p>
        <input type="number" name="cx2" id="cx2" placeholder="Número 2">
        <p>Escolha sua operação</p>
        <select name="" id="operacao">
            <option value="soma">Soma(+)</option>
            <option value="subtracao">Subtração(-)</option>
            <option value="multiplicacao">Multiplicação (×)</option>
            <option value="divisao">Divisão (÷)</option>
        </select>
        <input type="button" value="Resultado" onclick="calculo()">
        <p id="resultado" style="margin-bottom: 0px;">O resultado vai ser : </p>
    </main>
    <script>
        function calculo() {
            var cx1 = document.getElementById('cx1')
            var cx2 = document.getElementById('cx2')
            let tn1 = parseFloat(cx1.value) || 0
            let tn2 = parseFloat(cx2.value) || 0
            var op = document.getElementById('operacao').value
            var resultado;
            if (cx1.value === '' || cx2.value === '') {
                document.getElementById('resultado').innerText = 'Por favor, preencha os dois campos.';
                return;
            }
            if (op === 'divisao' && tn2 === 0) {
                document.getElementById('resultado').innerText = 'Erro: não é possível dividir por zero!';
                return;
            }
            switch (op) {
                case 'soma':
                    resultado = tn1 + tn2;
                    break;
                case 'subtracao':
                    resultado = tn1 - tn2;
                    break
                case 'multiplicacao':
                    resultado = tn1 * tn2;
                    break
                case 'divisao':
                    resultado = tn1 / tn2;
                    break
            }
            document.getElementById('resultado').innerText = `O resultado da sua operação é :${resultado.toFixed(2)}`;
            cx1.value = ""
            cx2.value = ""
            cx1.focus()
        }
    </script>
</body>

</html>
